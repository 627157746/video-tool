[package]
name = "video-tool"
version = "0.1.0"
description = "Desktop video toolkit: download, live record, local transcribe, AI summary"
authors = ["video-tool"]
edition = "2021"

[lib]
name = "video_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "7"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
fs2 = "0.4.3"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "blocking", "socks", "rustls-tls"] }
regex = "1.13.1"
