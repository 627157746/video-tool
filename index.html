<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video-tool · 本地视频工作台</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("video-tool.theme.preferences");
          var prefs = raw ? JSON.parse(raw) : { mode: "system", accent: "indigo" };
          var mode = prefs.mode === "light" || prefs.mode === "dark" ? prefs.mode : "system";
          var accent =
            prefs.accent === "cyan" ||
            prefs.accent === "emerald" ||
            prefs.accent === "rose" ||
            prefs.accent === "amber" ||
            prefs.accent === "violet"
              ? prefs.accent
              : "indigo";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.accent = accent;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.accent = "indigo";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
